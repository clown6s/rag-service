# ============================================================
# MySQL 8.4 业务库（阶段 2：审计聚合 + 数字员工配置）
#
# 用法：
#   在 deploy/mysql/ 目录（或含 .env 的目录）执行：
#     docker compose up -d
#   验证：
#     docker compose ps                     # STATUS 应为 healthy
#     docker exec mysql mysqladmin ping     # mysqld is alive
#
# 历史坑：
#   - MYSQL_ROOT_PASSWORD 若用弱密码，MySQL 8 官方镜像会静默初始化失败（容器反复重启）
#   - 默认 root 只允许容器内 localhost 登录；宿主机用 root 直连必须设 MYSQL_ROOT_HOST=%
#     （开发便利；生产建议专用账号，root 禁远程）
#   - rag-service 连接串带 allowPublicKeyRetrieval=true，对应 caching_sha2_password 认证
#   - 端口只绑 127.0.0.1（内网开发直连；生产改绑内网网卡或走容器网络）
#   - 数据卷 bind 挂载 ./volumes/mysql，勿删该目录（删=清库）
# ============================================================

services:
  mysql:
    image: mysql:8.4
    container_name: rag-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_service}
      MYSQL_USER: ${MYSQL_USERNAME:-rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
