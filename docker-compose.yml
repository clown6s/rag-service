version: '3.8'

services:
  # ==================== Milvus 依赖 ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    # 仅容器网络可达，不暴露宿主机
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379

  minio:
    image: minio/minio:RELEASE.2024-06-13
    environment:
      # 密码由 .env 注入，禁用默认弱密码 minioadmin/minioadmin
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: minio server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Milvus 向量数据库 ====================
  milvus:
    image: milvusdb/milvus:v2.5.0
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "19530:19530"
      # 管理端口仅绑定本机回环，不对公网暴露
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus

  # ==================== Neo4j 知识图谱（可选）====================
  neo4j:
    image: neo4j:5.21
    environment:
      # 密码由 .env 注入，禁用弱密码 password123
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    profiles:
      - graph

  # ==================== RAG 服务 ====================
  rag-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      MILVUS_HOST: milvus
      MILVUS_USERNAME: ${MILVUS_USERNAME}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD}
    depends_on:
      - milvus

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
