# ============================================================
# 配置导航
#   application.yml      — 基础配置（开发默认），全部敏感值走 .env
#   application-dev.yml  — 开发日志级别
#   application-prod.yml — 本地推理（vLLM Qwen + BGE-M3），LLM/Embedding 切 base-url
#   .env                 — 密钥（不入库，模板见 .env.example）
# 命名历史债：langchain4j.open-ai.deepseek 是全部 LLM 通道的共享段名
#   （chat/reasoner/contextual/graph/verify 五个 bean 共用其 api-key/base-url），
#   当前 dev 实际指向千问 DashScope，prod 覆盖为本地 vLLM
# ============================================================
server:
  port: 8080

logging:
  level:
    org.redisson: WARN                 # Redisson 默认 INFO 日志太吵
    io.modelcontextprotocol: OFF       # MCP SDK 内部重连噪声；故障由自有 McpServerHandle 日志呈现

spring:
  application:
    name: rag-service
  config:
    # 加载项目根目录 .env 文件（本地开发用，生产用系统环境变量）
    # optional: 文件不存在不报错；[.properties] 按 properties 格式解析（.env 的 KEY=VALUE 兼容）
    # 解决 spring-dotenv 未可靠注入环境变量导致占位符解析失败的问题
    import: "optional:file:.env[.properties]"
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ============================================================
# LangChain4j 配置
# ============================================================
langchain4j:
  open-ai:
    # OpenAI 兼容 LLM 通道 —— dev 用千问 DashScope（阿里云百炼），模型无关只改此处
    # 切回 DeepSeek：api-key 改 ${DEEPSEEK_API_KEY}，base-url 改 https://api.deepseek.com/v1，
    #   chat-model.model-name 改 deepseek-chat，reasoner.model-name 改 deepseek-reasoner
    # 上线切本地 vLLM：见 application-prod.yml
    deepseek:
      # 密钥必须由环境变量注入，无默认值（未配置即启动失败，避免硬编码泄露）
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat-model:
        model-name: qwen-plus            # 主力对话 + Agent 工具循环
        temperature: 0.3
        max-tokens: 4096
        timeout: 60s
      # 意图路由（纯文本分类，无需推理模型）
      reasoner:
        model-name: qwen-plus
        temperature: 0.1
        max-tokens: 1024
        timeout: 10s                     # 路由失败快速降级（历史坑：限流时 120s 卡死；30s→10s 收窄最坏等待）
      # 轻量任务小模型（省钱省延迟）
      contextual:
        model-name: qwen-turbo           # 文档摘要
      graph:
        model-name: qwen-plus            # 实体抽取（turbo 的 JSON 生成不稳定，频繁截断）
      verify:
        model-name: qwen-turbo           # 答案事实校验（修订输出完整回答，maxTokens=4096）

  # Embedding
  embedding:
    # BGE-M3 (可通过硅基流动 API 或本地部署)
    base-url: https://api.siliconflow.cn/v1
    api-key: ${SILICONFLOW_API_KEY}
    model: BAAI/bge-m3
    dimension: 1024

# ============================================================
# Milvus 向量数据库
# ============================================================
milvus:
  host: ${MILVUS_HOST:127.0.0.1}
  port: ${MILVUS_PORT:19530}
  database: rag_service
  collection: documents
  dimension: 1024
  index-type: HNSW
  metric-type: COSINE
  # Milvus 2.5 原生 BM25 全文索引
  enable-fulltext: true
  # HNSW 索引参数（修改后需 drop collection 重建索引才能生效）
  hnsw:
    m: 32
    ef-construction: 200
  # Milvus 鉴权（生产必须开启）
  username: ${MILVUS_USERNAME:}
  password: ${MILVUS_PASSWORD:}

# ============================================================
# Neo4j 图数据库（GraphRAG 知识图谱）
# ============================================================
neo4j:
  # 旧机器 10.211.55.30 已下线，Neo4j 与 Milvus 同迁至 10.211.55.5
  uri: bolt://10.211.55.5:7687
  authentication:
    username: neo4j
    # 密钥由环境变量注入（勿硬编码进 git）
    password: ${NEO4J_PASSWORD:}

# ============================================================
# RAG 参数
# ============================================================
rag:
  chunking:
    max-segment-size: 512     # tokens
    overlap-size: 50
  ingestion:
    status-file: data/ingestion-status.json  # 摄入状态持久化文件路径
  parse:
    # PDF 解析双通道：优先 ai-sidecar /parse（PyMuPDF 文本提取 + 扫描件检测），失败/未部署降级 Tika
    sidecar-url: http://127.0.0.1:8081
    sidecar-token: ${AISIDECAR_TOKEN:}
  retrieval:
    top-k: 20                 # 混合检索召回数
    final-k: 15               # Rerank 后保留数（10→15，让更多文档进入上下文）
    rrf-k: 60                 # RRF 融合平滑常数（论文经验值，40-80 均可）
    hnsw-ef: 128              # HNSW 搜索时探索宽度（≥ top-k*2，越大召回率越高但越慢）
    min-rerank-score: 0.3     # 重排后低于该分数的片段不进上下文（无关文档过滤；rerank 降级时跳过）
  rerank:
    model: BAAI/bge-reranker-v2-m3
    # 主通道：硅基流动 API。dev 机器 CPU 跑本地 rerank 约 41s/20条（实测），超过 30s 超时——
    # 本地推理（ai-sidecar）留给服务器/GPU 环境，就绪后与降级通道对调即可
    api-url: https://api.siliconflow.cn/v1/rerank
    api-key: ${SILICONFLOW_API_KEY:}
    # 降级通道：ai-sidecar 本地 bge-reranker（协议兼容，模型已就绪于 models/bge-reranker-v2-m3）
    fallback-api-url: http://127.0.0.1:8081/rerank
    fallback-api-key: ${AISIDECAR_TOKEN:}
  graph:
    max-hops: 2               # 图遍历最大跳数（越大越深但越慢）
    enabled: true             # 图谱构建开关（GraphRAG 增强项，关闭不影响检索主链路）
    async: true               # 异步构建：文档入库即 COMPLETED 可检索，图谱后台补建（大文档摄入提速的关键）
    extract-concurrency: 12   # 实体抽取并发（受 LLM 速率限制约束）
    rate-limit-per-second: 20 # 图构建 LLM 调用限流（千问配额宽裕；DeepSeek 时代曾压到 6 防挤爆评测）
  rewrite:
    multi-query-count: 3
  agent:
    max-sequential-tool-invocations: 5   # 单轮最多连续工具调用次数（防死循环）
    memory-max-messages: 12              # 服务端会话记忆窗口（按 conversationId 隔离）
    min-relevance-score: 0.3             # rerank 最高分低于该值视为检索未命中（触发确定性兜底回答）
    verify:
      enabled: true                      # 答案事实校验：生成后小模型对照检索资料核查删除无依据内容（编造最后防线，+1 次小模型调用）
  citation-guard:
    enabled: true                        # 法名引用校验：答案引用知识库外法律名称时追加标注（防引用幻觉）
  memory:
    redis:
      enabled: true                      # 会话记忆 Redis 持久化（不可用时自动降级进程内记忆）
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      db: 0
  audit:
    enabled: true              # 审计事件写入 logs/audit/audit-YYYY-MM-DD.jsonl（异步，不阻塞链路）
    log-dir: logs/audit
  alert:
    interval-ms: 60000               # 规则引擎评估周期
    window-minutes: 5                # 窗口统计长度
    error-rate-threshold: 0.3        # 错误率阈值（2 倍升级 CRITICAL）
    error-rate-min-samples: 10       # 错误率规则最小样本数（防小样本误报）
    slow-ms: 30000                   # 平均耗时告警阈值
    slow-min-samples: 5
    consecutive-failures: 5          # 连续失败条数
    feishu:
      webhook-url: ${FEISHU_ALERT_WEBHOOK_URL:}     # 飞书群机器人 webhook（配置才启用推送；软依赖）
      webhook-sign-secret: ${FEISHU_ALERT_WEBHOOK_SIGN_SECRET:}  # 群机器人签名密钥（可选）
  feishu:
    enabled: ${FEISHU_ENABLED:false}        # 飞书接入总开关（软依赖：默认关闭，平台不依赖任何 IM）
    base-url: ${FEISHU_BASE_URL:https://open.feishu.cn}  # 开放平台域名（私有化改自有域名，代码零改动）
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    verification-token: ${FEISHU_VERIFICATION_TOKEN:}    # 事件订阅验签 token（回调模式用；长连接模式忽略）
    default-agent-id: 0                     # 绑定数字员工 id（0=平台默认员工）
    long-connection: true                   # 长连接模式（出站 WS 收事件，内网友好）；false=HTTP 回调模式
  mysql:
    enabled: true              # 业务库（软依赖：未部署/故障时问答主链路不受影响，管理 API 降级提示）
    host: ${MYSQL_HOST:127.0.0.1}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DATABASE:rag_service}
    username: ${MYSQL_USERNAME:rag}
    # 兼容两种 key 写法（root 直连场景常见 MYSQL_ROOT_PASSWORD）
    password: ${MYSQL_ROOT_PASSWORD:}
    audit-aggregate-interval-ms: 10000   # 审计 JSONL → MySQL 聚合周期
    audit-rescan-days: 3                 # 重启后重扫最近 N 天 JSONL（幂等补漏）
  skill:
    default-employee-id: 0              # 默认数字员工 id（0=自动取最小启用员工；ToolProvider 装配授权快照用）
  mcp:
    demo:
      enabled: true                     # 内置演示 MCP 服务（阶段3 试点，/mcp/demo/sse）
  upload:
    max-file-size: 20MB
    allowed-types: pdf,docx,doc,md,txt,html
