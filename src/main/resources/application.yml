server:
  port: 8080

logging:
  level:
    org.redisson: WARN                 # Redisson 默认 INFO 日志太吵

spring:
  application:
    name: rag-service
  config:
    # 加载项目根目录 .env 文件（本地开发用，生产用系统环境变量）
    # optional: 文件不存在不报错；[.properties] 按 properties 格式解析（.env 的 KEY=VALUE 兼容）
    # 解决 spring-dotenv 未可靠注入环境变量导致占位符解析失败的问题
    import: "optional:file:.env[.properties]"
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ============================================================
# LangChain4j 配置
# ============================================================
langchain4j:
  open-ai:
    # OpenAI 兼容 LLM 通道 —— dev 用千问 DashScope（阿里云百炼），模型无关只改此处
    # 切回 DeepSeek：api-key 改 ${DEEPSEEK_API_KEY}，base-url 改 https://api.deepseek.com/v1，
    #   chat-model.model-name 改 deepseek-chat，reasoner.model-name 改 deepseek-reasoner
    # 上线切本地 vLLM：见 application-prod.yml
    deepseek:
      # 密钥必须由环境变量注入，无默认值（未配置即启动失败，避免硬编码泄露）
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat-model:
        model-name: qwen-plus            # 主力对话 + Agent 工具循环
        temperature: 0.3
        max-tokens: 4096
        timeout: 60s
      # 意图路由（纯文本分类，无需推理模型）
      reasoner:
        model-name: qwen-plus
        temperature: 0.1
        max-tokens: 1024
        timeout: 30s                     # 路由失败快速降级（历史坑：限流时 120s 卡死）
      # 轻量任务小模型（省钱省延迟）
      contextual:
        model-name: qwen-turbo           # 文档摘要
      graph:
        model-name: qwen-turbo           # 实体抽取

  # Embedding
  embedding:
    # BGE-M3 (可通过硅基流动 API 或本地部署)
    base-url: https://api.siliconflow.cn/v1
    api-key: ${SILICONFLOW_API_KEY}
    model: BAAI/bge-m3
    dimension: 1024

# ============================================================
# Milvus 向量数据库
# ============================================================
milvus:
  host: ${MILVUS_HOST:127.0.0.1}
  port: ${MILVUS_PORT:19530}
  database: rag_service
  collection: documents
  dimension: 1024
  index-type: HNSW
  metric-type: COSINE
  # Milvus 2.5 原生 BM25 全文索引
  enable-fulltext: true
  # HNSW 索引参数（修改后需 drop collection 重建索引才能生效）
  hnsw:
    m: 32
    ef-construction: 200
  # Milvus 鉴权（生产必须开启）
  username: ${MILVUS_USERNAME:}
  password: ${MILVUS_PASSWORD:}

# ============================================================
# Neo4j 图数据库（GraphRAG 知识图谱）
# ============================================================
neo4j:
  # 旧机器 10.211.55.30 已下线，Neo4j 与 Milvus 同迁至 10.211.55.5
  uri: bolt://10.211.55.5:7687
  authentication:
    username: neo4j
    # 密钥由环境变量注入（勿硬编码进 git）
    password: ${NEO4J_PASSWORD:}

# ============================================================
# RAG 参数
# ============================================================
rag:
  chunking:
    max-segment-size: 512     # tokens
    overlap-size: 50
  ingestion:
    status-file: data/ingestion-status.json  # 摄入状态持久化文件路径
  parse:
    # PDF 解析双通道：优先 ai-sidecar /parse（PyMuPDF 文本提取 + 扫描件检测），失败/未部署降级 Tika
    sidecar-url: http://127.0.0.1:8081
    sidecar-token: ${AISIDECAR_TOKEN:}
  retrieval:
    top-k: 20                 # 混合检索召回数
    final-k: 15               # Rerank 后保留数（10→15，让更多文档进入上下文）
    rrf-k: 60                 # RRF 融合平滑常数（论文经验值，40-80 均可）
    hnsw-ef: 128              # HNSW 搜索时探索宽度（≥ top-k*2，越大召回率越高但越慢）
    min-rerank-score: 0.3     # 重排后低于该分数的片段不进上下文（无关文档过滤；rerank 降级时跳过）
  rerank:
    model: BAAI/bge-reranker-v2-m3
    # 主通道：硅基流动 API。dev 机器 CPU 跑本地 rerank 约 41s/20条（实测），超过 30s 超时——
    # 本地推理（ai-sidecar）留给服务器/GPU 环境，就绪后与降级通道对调即可
    api-url: https://api.siliconflow.cn/v1/rerank
    api-key: ${SILICONFLOW_API_KEY:}
    # 降级通道：ai-sidecar 本地 bge-reranker（协议兼容，模型已就绪于 models/bge-reranker-v2-m3）
    fallback-api-url: http://127.0.0.1:8081/rerank
    fallback-api-key: ${AISIDECAR_TOKEN:}
  graph:
    max-hops: 2               # 图遍历最大跳数（越大越深但越慢）
    enabled: true             # 图谱构建开关（GraphRAG 增强项，关闭不影响检索主链路）
    async: true               # 异步构建：文档入库即 COMPLETED 可检索，图谱后台补建（大文档摄入提速的关键）
    extract-concurrency: 8    # 实体抽取并发（受 LLM 速率限制约束）
    rate-limit-per-second: 6  # 图构建 LLM 调用限流（保护共享 key 配额；0=不限）
  rewrite:
    multi-query-count: 3
  agent:
    max-sequential-tool-invocations: 5   # 单轮最多连续工具调用次数（防死循环）
    memory-max-messages: 12              # 服务端会话记忆窗口（按 conversationId 隔离）
    min-relevance-score: 0.3             # rerank 最高分低于该值视为检索未命中（触发确定性兜底回答）
  citation-guard:
    enabled: true                        # 法名引用校验：答案引用知识库外法律名称时追加标注（防引用幻觉）
  memory:
    redis:
      enabled: true                      # 会话记忆 Redis 持久化（不可用时自动降级进程内记忆）
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      db: 0
  audit:
    enabled: true              # 审计事件写入 logs/audit/audit-YYYY-MM-DD.jsonl（异步，不阻塞链路）
    log-dir: logs/audit
  upload:
    max-file-size: 20MB
    allowed-types: pdf,docx,doc,md,txt,html
